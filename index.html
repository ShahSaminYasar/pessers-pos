<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pessers POS</title>
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "#07070a",
              surf: "#131316",
              surf2: "#1b1b1f",
              line: "rgba(255,255,255,.09)",
              line2: "rgba(255,255,255,.18)",
              ink: "#f5f5f7",
              mute: "#a7a7b2",
              red: "#ea1c24",
              redlite: "#ff4650",
              reddim: "#38090b",
            },
            fontFamily: {
              display: ["Barlow Condensed", "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
            boxShadow: {
              glow: "0 0 0 1px rgba(234,28,36,.35), 0 0 32px -4px rgba(234,28,36,.35)",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .inp {
          @apply w-full rounded-lg bg-surf2 border border-line px-3 py-2 mb-2 text-ink placeholder-mute outline-none transition focus:border-red focus:ring-1 focus:ring-red/40;
        }
        .lbl {
          @apply block text-[11px] uppercase tracking-wider text-mute mt-3 mb-1 font-semibold;
        }
        .chip {
          @apply px-3 py-1.5 rounded-full bg-surf2 text-ink border border-line text-sm font-medium transition hover:border-red/60 hover:text-redlite active:scale-95;
        }
        .btn-p {
          @apply flex-1 rounded-xl bg-red text-white font-semibold py-2.5 px-4 transition hover:bg-redlite active:scale-[.97] shadow-[0_8px_20px_-6px_rgba(234,28,36,.6)];
        }
        .btn-g {
          @apply flex-1 rounded-xl bg-surf2 border border-line text-ink py-2.5 px-4 transition hover:border-line2 active:scale-[.97];
        }
        .btn-d {
          @apply rounded-xl bg-transparent text-redlite border border-red/50 py-2.5 px-4 transition hover:bg-red/10 active:scale-[.97];
        }
        .card {
          @apply rounded-2xl bg-surf border border-line p-4;
        }
      }
    </style>
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
        background-color: #07070a;
        background-image:
          radial-gradient(
            circle at 15% 0%,
            rgba(234, 28, 36, 0.14),
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 100%,
            rgba(234, 28, 36, 0.08),
            transparent 40%
          );
        background-attachment: fixed;
        color-scheme: dark;
      }
      .font-display {
        font-family: "Barlow Condensed", sans-serif;
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      @keyframes timeup-glow {
        0%,
        100% {
          box-shadow:
            0 0 0 1px rgba(234, 28, 36, 0.5),
            0 0 40px -6px rgba(234, 28, 36, 0.65);
          background-color: #1b0a0b;
        }
        50% {
          box-shadow:
            0 0 0 1px rgba(255, 70, 80, 0.75),
            0 0 56px -4px rgba(255, 70, 80, 0.75);
          background-color: #2a0d0f;
        }
      }
      .timeup {
        animation: timeup-glow 1.1s ease-in-out infinite;
      }
      @keyframes live-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(1.3);
        }
      }
      .live-dot {
        animation: live-pulse 1.4s ease-in-out infinite;
      }
      ::selection {
        background: #ea1c24;
        color: #fff;
      }
      * {
        scrollbar-color: #3a3a40 #131316;
      }
      input:focus,
      select:focus,
      button:focus-visible {
        outline: none;
      }
      button:focus-visible,
      a:focus-visible {
        box-shadow:
          0 0 0 2px #07070a,
          0 0 0 4px #ea1c24;
      }
      @media (prefers-reduced-motion: reduce) {
        .timeup,
        .live-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="min-h-screen text-ink font-body">
    <header
      class="sticky top-0 z-10 bg-[#0a0a0d]/90 backdrop-blur border-b border-line"
    >
      <div
        class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4"
      >
        <button
          onclick="toggleMenu()"
          id="burger"
          aria-label="Open menu"
          aria-expanded="false"
          class="md:hidden flex items-center justify-center h-10 w-10 shrink-0 rounded-lg bg-surf2 border border-line text-ink transition hover:border-red/50 active:scale-95"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="flex items-center gap-2.5">
          <img src="logo.png" alt="Pessers" class="size-12 object-contain" />
          <div class="leading-tight">
            <div class="font-display font-bold text-lg tracking-wide">
              PESSERS
            </div>
            <div
              class="font-display text-[11px] text-red tracking-[0.2em] -mt-1"
            >
              GAMING CAFE
            </div>
          </div>
        </div>
        <nav
          id="nav"
          class="hidden md:flex gap-1 text-sm font-display font-semibold"
        ></nav>
        <div class="ml-auto flex items-center gap-3">
          <span id="clock" class="tnum text-mute text-sm font-display"></span>
          <button
            id="snd"
            onclick="enableSound()"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red text-white text-sm font-semibold transition hover:bg-redlite active:scale-95 shadow-[0_6px_16px_-4px_rgba(234,28,36,.6)]"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path
                d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"
              ></path>
            </svg>
            Enable sound
          </button>
        </div>
      </div>
    </header>
    <main id="app" class="max-w-6xl mx-auto p-4"></main>
    <div id="modal"></div>
    <div id="miniMap"></div>
    <div id="mobileMenu"></div>

    <script type="module">
      import {
        animate,
        stagger,
      } from "https://cdn.jsdelivr.net/npm/motion@10.18.0/+esm";
      window.Motion = { animate, stagger };
      window.dispatchEvent(new Event("motion-ready"));
    </script>

    <script>
      const KEY = "cafe_proto_v1",
        METHODS = ["Cash", "bKash", "Nagad"];
      const $ = (s) => document.querySelector(s);
      const uid = () => Math.random().toString(36).slice(2, 9);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const tk = (n) => "Tk " + Math.round(n).toLocaleString("en-IN");
      const hm = (t) =>
        new Date(t).toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
        });
      const dt = (t) =>
        new Date(t).toLocaleDateString([], { day: "numeric", month: "short" });
      const isToday = (t) =>
        new Date(t).toDateString() === new Date().toDateString();
      const lbl = (m) =>
        m < 60
          ? m + "m"
          : Math.floor(m / 60) + "h" + (m % 60 ? " " + (m % 60) + "m" : "");
      const opts = METHODS.map((m) => `<option>${m}</option>`).join("");
      /* floor map: a fixed 2-column grid of square cells; stations sit in named cells, everything else is open floor ("gap") */
      const defPos = {
        s1: { row: 2, col: 1 },
        s2: { row: 3, col: 1 },
        s3: { row: 1, col: 2 },
      };
      function nextCell(occ) {
        let r = 1;
        while (true) {
          for (let c = 1; c <= 2; c++) {
            const k = r + "," + c;
            if (!occ.has(k)) return { row: r, col: c };
          }
          r++;
        }
      }
      let tab = "stations",
        popupKind = null,
        menuOpen = false,
        db = load(),
        curSid,
        dueTouched = false,
        lastUp = {},
        ac = null,
        n = 0;

      /* ---- motion helpers: respect prefers-reduced-motion, no-op if the module hasn't loaded yet ---- */
      const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
      function fadeIn(el) {
        if (RM || !window.Motion || !el) return;
        window.Motion.animate(
          el,
          { opacity: [0, 1], transform: ["translateY(8px)", "translateY(0)"] },
          { duration: 0.3, easing: [0.16, 1, 0.3, 1] },
        );
      }
      function stagIn(sel) {
        if (RM || !window.Motion) return;
        const els = document.querySelectorAll(sel);
        if (!els.length) return;
        window.Motion.animate(
          els,
          {
            opacity: [0, 1],
            transform: [
              "translateY(14px) scale(.98)",
              "translateY(0) scale(1)",
            ],
          },
          {
            duration: 0.4,
            delay: window.Motion.stagger(0.06),
            easing: [0.16, 1, 0.3, 1],
          },
        );
      }
      function panelIn(el) {
        if (RM || !window.Motion || !el) return;
        window.Motion.animate(
          el,
          { opacity: [0, 1], transform: ["scale(.94)", "scale(1)"] },
          { duration: 0.22, easing: [0.16, 1, 0.3, 1] },
        );
      }
      function drawerIn(el) {
        if (RM || !window.Motion || !el) return;
        window.Motion.animate(
          el,
          { transform: ["translateX(-100%)", "translateX(0)"] },
          { duration: 0.3, easing: [0.16, 1, 0.3, 1] },
        );
      }
      window.addEventListener("motion-ready", () => render());
      function seed() {
        return {
          stations: [
            {
              id: "s1",
              name: "PS4-1",
              type: "PS4",
              hourly: 150,
              half: 80,
              order: 1,
              active: true,
              pos: { ...defPos.s1 },
            },
            {
              id: "s2",
              name: "PS4-2",
              type: "PS4",
              hourly: 150,
              half: 80,
              order: 2,
              active: true,
              pos: { ...defPos.s2 },
            },
            {
              id: "s3",
              name: "PS5",
              type: "PS5",
              hourly: 250,
              half: 150,
              order: 3,
              active: true,
              pos: { ...defPos.s3 },
            },
          ],
          sessions: [],
          expenses: [],
        };
      }
      function migrate(d) {
        const occ = new Set();
        d.stations.forEach((s) => {
          if (s.pos) occ.add(s.pos.row + "," + s.pos.col);
        });
        d.stations.forEach((s) => {
          if (s.pos) return;
          const p = defPos[s.id];
          s.pos = p && !occ.has(p.row + "," + p.col) ? p : nextCell(occ);
          occ.add(s.pos.row + "," + s.pos.col);
        });
        return d;
      }
      function load() {
        try {
          const d = JSON.parse(localStorage.getItem(KEY));
          if (d && d.stations) return migrate(d);
        } catch (e) {}
        return migrate(seed());
      }
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(db));
        } catch (e) {}
      }

      /* ---- pricing: follows the cafe's rate card; cashier can always override ---- */
      const perMin = (r) => r.hourly / 60;
      const booked$ = (r, m) =>
        m % 30 === 0
          ? Math.floor(m / 60) * r.hourly + (m % 60 === 30 ? r.half : 0)
          : Math.round(perMin(r) * m);
      const suggest = (r, b, u) =>
        Math.round(
          u >= b
            ? booked$(r, b) + perMin(r) * (u - b)
            : Math.min(booked$(r, b), perMin(r) * u),
        );
      const paid = (s) => s.payments.reduce((a, p) => a + p.amt, 0);
      const sess = (id) => db.sessions.find((x) => x.id === id);
      const running = (sid) =>
        db.sessions.find((x) => x.stationId === sid && x.status === "running");
      const isUp = (s) => s.status === "running" && Date.now() >= s.endsAt;
      // owner to confirm: nearest minute used here (alternative: every started minute counts)
      const usedMin = (s) =>
        Math.max(
          0,
          Math.round(((s.endedAt || Date.now()) - s.startedAt) / 60000),
        );
      function cd(s) {
        const d = s.endsAt - Date.now(),
          a = Math.abs(d),
          h = Math.floor(a / 36e5),
          m = Math.floor((a % 36e5) / 6e4),
          c = Math.floor((a % 6e4) / 1e3);
        const t =
          (h ? h + ":" : "") +
          String(m).padStart(2, "0") +
          ":" +
          String(c).padStart(2, "0");
        return d >= 0 ? t : "+" + t;
      }
      function est(s) {
        const bal = s.due - paid(s);
        return isUp(s)
          ? `Overtime estimate <b class="text-redlite">${tk(suggest(s.rate, s.bookedMin, usedMin(s)))}</b> · paid ${tk(paid(s))}`
          : `Charge <b class="text-ink">${tk(s.due)}</b> · ${bal > 0 ? '<span class="text-redlite">owes ' + tk(bal) + "</span>" : bal < 0 ? "overpaid " + tk(-bal) : "paid in full"}`;
      }

      /* ---- sound ---- */
      function enableSound() {
        try {
          ac = ac || new (window.AudioContext || window.webkitAudioContext)();
          ac.resume();
          beep();
          navigator.wakeLock &&
            navigator.wakeLock.request("screen").catch(() => {});
        } catch (e) {}
        const b = $("#snd");
        b.innerHTML =
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>Sound on';
        b.className =
          "flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surf2 border border-line text-ink text-sm font-semibold";
      }
      function beep() {
        if (!ac) return;
        const o = ac.createOscillator(),
          g = ac.createGain();
        o.connect(g);
        g.connect(ac.destination);
        o.type = "square";
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.15, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
        o.start();
        o.stop(ac.currentTime + 0.4);
      }

      /* ---- modal ---- */
      function modal(h) {
        $("#modal").innerHTML =
          `<div class="fixed inset-0 z-20 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this)closeM()"><div id="modalPanel" class="w-full max-w-md rounded-2xl bg-surf border border-line shadow-2xl shadow-black/60 text-ink p-5 max-h-[90vh] overflow-y-auto">${h}</div></div>`;
        panelIn($("#modalPanel"));
      }
      function closeM() {
        popupKind = null;
        $("#modal").innerHTML = "";
      }

      /* ---- floor map: fixed 2-col grid of square cells (gaps render as empty dashed slots) ---- */
      function podCell(st, small) {
        const s = running(st.id),
          up = s && isUp(s);
        const ring = !s ? "border-line" : up ? "border-red" : "border-red/50";
        const img = st.type === "PS5" ? "ps5.png" : "ps4.png";
        if (small)
          return `<div class="aspect-square relative rounded-md overflow-hidden border ${!s ? "border-line/70" : up ? "border-red" : "border-red/60"} ${!s ? "grayscale-[60%] opacity-70" : ""}">
  <img src="${img}" alt="" class="absolute inset-0 w-full h-full object-cover">
  ${s ? `<span class="live-dot absolute top-0.5 right-0.5 h-1.5 w-1.5 rounded-full ${up ? "bg-redlite" : "bg-red"}"></span>` : ""}
 </div>`;
        return `<div class="aspect-square relative rounded-xl border ${ring} ${s && !up ? "shadow-glow" : ""} ${up ? "timeup" : ""} overflow-hidden cursor-pointer transition ${!s ? "grayscale-[50%] opacity-80 hover:opacity-100 hover:grayscale-0" : ""}" onclick="closeM();podClick('${st.id}')">
  <img src="${img}" alt="${esc(st.type)} station layout" class="absolute inset-0 w-full h-full object-cover pointer-events-none select-none">
  <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/10 to-black/25 pointer-events-none"></div>
  ${s ? `<span class="live-dot absolute top-1.5 right-1.5 h-2 w-2 rounded-full ${up ? "bg-redlite" : "bg-red"}"></span>` : ""}
  <div class="absolute inset-x-0 bottom-0 p-2 text-center pointer-events-none">
   <div class="font-display font-bold text-sm leading-tight drop-shadow-md">${esc(st.name)}</div>
   ${s ? `<div id="t-m-${st.id}" class="tnum font-display text-lg font-bold leading-tight drop-shadow-md ${up ? "text-redlite" : "text-ink"}">${cd(s)}</div>` : '<div class="text-[11px] text-mute font-medium drop-shadow-md">Free</div>'}
  </div>
 </div>`;
      }
      function floorGrid(small) {
        const sts = db.stations.filter((x) => x.active);
        if (!sts.length)
          return '<p class="text-mute text-sm p-2">No stations yet.</p>';
        const maxRow = Math.max(3, ...sts.map((s) => s.pos.row));
        let cells = "";
        for (let r = 1; r <= maxRow; r++)
          for (let c = 1; c <= 2; c++) {
            const st = sts.find((s) => s.pos.row === r && s.pos.col === c);
            cells += st
              ? podCell(st, small)
              : `<div class="aspect-square rounded-${small ? "md" : "xl"} border border-dashed border-line/50"></div>`;
          }
        return `<div class="grid grid-cols-2 ${small ? "gap-1" : "gap-3"}">${cells}</div>`;
      }
      function miniMapWidget() {
        if (!db.stations.some((x) => x.active)) return "";
        return `<button onclick="openFloorPlan()" class="fixed bottom-5 right-5 z-10 w-24 rounded-2xl bg-surf border border-line shadow-2xl shadow-black/60 p-2 transition hover:border-red/60 active:scale-95 group" aria-label="Open station map">
  ${floorGrid(true)}
  <div class="text-[10px] font-display font-bold tracking-wider text-mute group-hover:text-redlite mt-1.5 text-center">MAP ⤢</div>
 </button>`;
      }
      function renderMiniMap() {
        const el = $("#miniMap");
        if (el) el.innerHTML = miniMapWidget();
      }
      function openFloorPlan() {
        popupKind = { kind: "map" };
        modal(
          `<div class="flex items-center justify-between mb-3"><h2 class="font-display text-xl font-bold">Station map</h2><button onclick="closeM()" class="text-mute hover:text-ink text-2xl leading-none">&times;</button></div>${floorGrid(false)}`,
        );
      }

      function podClick(id) {
        running(id) ? stationActions(id) : startM(id);
      }
      function stationActions(id) {
        const s = running(id);
        if (!s) return startM(id);
        popupKind = { kind: "actions", id };
        const up = isUp(s),
          bal = s.due - paid(s);
        modal(`<h2 class="font-display text-xl font-bold mb-1">${esc(s.stationName)} · ${esc(s.name)}</h2>
 <div class="text-sm text-mute mb-3">${hm(s.startedAt)}–${hm(s.endsAt)} · ${s.bookedMin} min</div>
 <div id="t-act-${id}" class="tnum font-display text-3xl font-bold mb-1 ${up ? "text-redlite" : "text-ink"}">${cd(s)}</div>
 <div id="e-act-${id}" class="text-sm text-mute mb-3">${est(s)}</div>
 <div class="flex flex-wrap gap-2">${up && !s.ack ? `<button onclick="ack('${id}');closeM()" class="chip">Silence</button>` : ""}<button onclick="closeM();extM('${id}')" class="chip">Extend</button>${bal > 0 ? `<button onclick="closeM();payM('${id}')" class="chip">Collect ${tk(bal)}</button>` : ""}<button onclick="closeM();endM('${id}')" class="chip !bg-red !text-white !border-red">End &amp; bill</button></div>
 <button onclick="closeM()" class="btn-g w-full mt-4">Close</button>`);
      }

      /* ---- views ---- */
      function viewStations() {
        const sts = db.stations
          .filter((x) => x.active)
          .sort((a, b) => a.order - b.order);
        if (!sts.length)
          return '<p class="text-mute">No stations yet. Add one in Settings.</p>';
        return (
          '<div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">' +
          sts
            .map((st) => {
              const s = running(st.id);
              const head = `<div class="flex items-start justify-between"><div><div class="font-display text-2xl font-bold">${esc(st.name)}</div><div class="text-xs text-mute">${tk(st.hourly)}/hr · ${tk(st.half)}/30 min</div></div>${s ? `<span class="live-dot h-2.5 w-2.5 rounded-full ${isUp(s) ? "bg-redlite" : "bg-red"} mt-1.5"></span>` : ""}</div>`;
              if (!s)
                return `<div class="station-card card flex flex-col gap-4">${head}<div class="flex items-center justify-between mt-auto pt-2"><span class="text-mute text-sm font-medium">Free</span><button onclick="startM('${st.id}')" class="btn-p !flex-none px-5">Start session</button></div></div>`;
              const up = isUp(s),
                bal = s.due - paid(s);
              return `<div class="station-card card flex flex-col gap-3 ${up ? "timeup" : ""} border-red/40">${head}
  <div><div class="font-semibold">${esc(s.name)}${up ? ' <span class="text-redlite">— time is up</span>' : ""}</div><div class="text-sm text-mute">${hm(s.startedAt)}–${hm(s.endsAt)} · ${s.bookedMin} min</div><div id="e-${s.id}" class="text-sm text-mute mt-1">${est(s)}</div></div>
  <div id="t-${s.id}" class="tnum font-display text-5xl font-bold ${up ? "text-white" : "text-ink"}">${cd(s)}</div>
  <div class="flex flex-wrap gap-2 mt-auto pt-1">${up && !s.ack ? `<button onclick="ack('${s.id}')" class="chip">Silence</button>` : ""}<button onclick="extM('${s.id}')" class="chip">Extend</button>${bal > 0 ? `<button onclick="payM('${s.id}')" class="chip">Collect ${tk(bal)}</button>` : ""}<button onclick="endM('${s.id}')" class="chip !bg-red !text-white !border-red">End &amp; bill</button></div></div>`;
            })
            .join("") +
          "</div>"
        );
      }

      function viewLog() {
        const rows = [...db.sessions]
          .sort((a, b) => b.startedAt - a.startedAt)
          .map((s) => {
            const bal = s.due - paid(s),
              st =
                s.status === "running"
                  ? isUp(s)
                    ? '<span class="px-2 py-0.5 rounded-full bg-red/15 text-redlite text-xs font-semibold">Time up</span>'
                    : '<span class="px-2 py-0.5 rounded-full bg-surf2 border border-line text-xs font-semibold">Running</span>'
                  : s.status === "void"
                    ? '<span class="px-2 py-0.5 rounded-full bg-surf2 border border-line text-mute text-xs font-semibold">Void</span>'
                    : bal > 0
                      ? `<span class="text-redlite font-semibold">Owes ${tk(bal)}</span>`
                      : '<span class="text-mute">Paid</span>';
            return `<tr class="border-t border-line hover:bg-surf2/60 transition"><td class="p-2.5">${dt(s.startedAt)}</td><td class="p-2.5">${esc(s.name)}</td><td class="p-2.5">${esc(s.stationName)}</td><td class="p-2.5 tnum">${hm(s.startedAt)}</td><td class="p-2.5 tnum">${hm(s.endedAt || s.endsAt)}${s.endedAt ? "" : "*"}</td><td class="p-2.5 tnum">${tk(s.due)}</td><td class="p-2.5 tnum">${tk(paid(s))}</td><td class="p-2.5">${st}</td></tr>`;
          })
          .join("");
        return `<div class="flex items-center justify-between mb-3"><h2 class="font-display text-2xl font-bold">Session log</h2><button class="chip" onclick="csv()">Export CSV</button></div>
 <div class="card !p-0 overflow-x-auto"><table class="w-full text-sm"><thead class="bg-surf2 text-mute text-left"><tr>${["Date", "Name", "Station", "Start", "End", "Charge", "Paid", "Status"].map((h) => `<th class="p-2.5 text-[11px] uppercase tracking-wider font-semibold">${h}</th>`).join("")}</tr></thead><tbody>${rows || '<tr><td class="p-6 text-mute text-center" colspan="8">No sessions yet. Start one from the Stations tab.</td></tr>'}</tbody></table></div>
 <p class="text-xs text-mute mt-2">* planned end time, session still running</p>`;
      }

      function viewFin() {
        const pays = db.sessions.flatMap((s) =>
          s.payments.filter((p) => isToday(p.at)),
        );
        const by = (m) =>
            pays.filter((p) => p.method === m).reduce((a, p) => a + p.amt, 0),
          inc = pays.reduce((a, p) => a + p.amt, 0);
        const ex = db.expenses.filter((e) => isToday(e.at)),
          exT = ex.reduce((a, e) => a + e.amt, 0);
        const adj = db.sessions.filter(
            (s) =>
              s.status === "done" &&
              isToday(s.endedAt) &&
              s.suggested !== s.due,
          ),
          adjT = adj.reduce((a, s) => a + s.suggested - s.due, 0);
        const owed = db.sessions.filter(
          (s) => s.status === "done" && s.due - paid(s) > 0,
        );
        const net = inc - exT;
        const card = (t, v, c = "text-ink") =>
          `<div class="card"><div class="text-[11px] uppercase tracking-wider text-mute font-semibold">${t}</div><div class="font-display text-3xl font-bold mt-1 ${c}">${v}</div></div>`;
        return `<h2 class="font-display text-2xl font-bold mb-3">Today</h2>
 <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${card("Income", tk(inc))}${card("Expenses", tk(exT), "text-redlite")}${card("Net", tk(net), net < 0 ? "text-redlite" : "text-ink")}${card("Discounts vs suggested", tk(adjT) + " (" + adj.length + ")")}</div>
 <p class="text-sm text-mute mt-3 mb-6">Cash ${tk(by("Cash"))} · bKash ${tk(by("bKash"))} · Nagad ${tk(by("Nagad"))}</p>
 <div class="grid lg:grid-cols-2 gap-6">
 <div><h3 class="font-display text-lg font-bold mb-2">Unpaid balances</h3><div class="card !p-3 divide-y divide-line">${owed.map((s) => `<div class="flex justify-between items-center py-2 text-sm"><span>${esc(s.name)} · ${esc(s.stationName)} · ${dt(s.startedAt)}</span><span class="flex items-center gap-2"><b class="text-redlite">${tk(s.due - paid(s))}</b><button class="chip !py-1 !px-2.5 !text-xs" onclick="payM('${s.id}')">Collect</button></span></div>`).join("") || '<p class="text-mute text-sm py-1">Nothing owed.</p>'}</div></div>
 <div><h3 class="font-display text-lg font-bold mb-2">Add expense</h3><div class="card flex gap-2 flex-wrap items-start"><select id="x-cat" class="inp !w-auto !mb-0">${["Rent", "Electricity", "Salary", "Games / PSN", "Repairs", "Snacks stock", "Other"].map((c) => `<option>${c}</option>`).join("")}</select><input id="x-amt" type="number" placeholder="Tk" class="inp !w-24 !mb-0"><input id="x-note" placeholder="Note" class="inp !w-36 !mb-0"><button class="chip !bg-red !text-white !border-red" onclick="addExp()">Add</button></div>
 <div class="card !p-3 mt-3 divide-y divide-line">${ex.map((e) => `<div class="flex justify-between py-2 text-sm"><span>${esc(e.cat)}${e.note ? " — " + esc(e.note) : ""}</span><span class="flex items-center gap-2">${tk(e.amt)}<button class="text-redlite hover:text-white transition" onclick="delExp('${e.id}')">Remove</button></span></div>`).join("") || '<p class="text-mute text-sm py-1">No expenses logged today.</p>'}</div></div></div>`;
      }

      function viewSet() {
        const rows = [...db.stations]
          .sort((a, b) => a.order - b.order)
          .map(
            (
              s,
            ) => `<tr class="border-t border-line ${s.active ? "" : "opacity-40"}">
 <td class="p-2"><input class="inp !mb-0 !w-32" value="${esc(s.name)}" onchange="ed('${s.id}','name',this.value)"></td>
 <td class="p-2"><input class="inp !mb-0 !w-20" value="${esc(s.type)}" onchange="ed('${s.id}','type',this.value)"></td>
 <td class="p-2"><input type="number" class="inp !mb-0 !w-24" value="${s.hourly}" onchange="ed('${s.id}','hourly',+this.value)"></td>
 <td class="p-2"><input type="number" class="inp !mb-0 !w-24" value="${s.half}" onchange="ed('${s.id}','half',+this.value)"></td>
 <td class="p-2"><input type="number" class="inp !mb-0 !w-16" value="${s.order}" onchange="ed('${s.id}','order',+this.value);render()"></td>
 <td class="p-2"><button class="chip" onclick="toggleSt('${s.id}')">${s.active ? "Archive" : "Restore"}</button></td></tr>`,
          )
          .join("");
        return `<div class="flex items-center justify-between mb-3"><h2 class="font-display text-2xl font-bold">Stations and prices</h2><button class="chip !bg-red !text-white !border-red" onclick="addSt()">Add station</button></div>
 <div class="card !p-0 overflow-x-auto"><table class="w-full text-sm"><thead class="bg-surf2 text-mute text-left"><tr><th class="p-2.5 text-[11px] uppercase tracking-wider font-semibold">Name</th><th class="p-2.5 text-[11px] uppercase tracking-wider font-semibold">Type</th><th class="p-2.5 text-[11px] uppercase tracking-wider font-semibold">1 hour (Tk)</th><th class="p-2.5 text-[11px] uppercase tracking-wider font-semibold">30 min (Tk)</th><th class="p-2.5 text-[11px] uppercase tracking-wider font-semibold">Position</th><th class="p-2.5"></th></tr></thead><tbody>${rows}</tbody></table></div>
 <p class="text-sm text-mute mt-2">Price changes apply to new sessions only. Archived stations stay in the log.</p>
 <button class="btn-d mt-6" onclick="resetAll()">Erase all demo data</button>`;
      }

      const NAV_ITEMS = [
        ["stations", "Stations"],
        ["log", "Log"],
        ["fin", "Finance"],
        ["set", "Settings"],
      ];
      function goTab(k) {
        tab = k;
        if (menuOpen) toggleMenu();
        render();
      }
      function render() {
        $("#nav").innerHTML = NAV_ITEMS.map(
          ([k, l]) =>
            `<button onclick="goTab('${k}')" class="px-3.5 py-1.5 rounded-full transition ${tab === k ? "bg-red text-white" : "text-mute hover:text-ink"}">${l}</button>`,
        ).join("");
        $("#app").innerHTML = {
          stations: viewStations,
          log: viewLog,
          fin: viewFin,
          set: viewSet,
        }[tab]();
        if (tab === "stations") stagIn(".station-card");
        else fadeIn($("#app"));
        renderMiniMap();
      }

      /* ---- mobile nav drawer ---- */
      function renderMenu() {
        const el = $("#mobileMenu");
        if (!el) return;
        const burger = $("#burger");
        if (burger) burger.setAttribute("aria-expanded", String(menuOpen));
        document.body.style.overflow = menuOpen ? "hidden" : "";
        if (!menuOpen) {
          el.innerHTML = "";
          return;
        }
        el.innerHTML = `<div class="fixed inset-0 z-30 bg-black/70 backdrop-blur-sm" onclick="toggleMenu()"></div>
 <div id="drawerPanel" class="fixed inset-y-0 left-0 z-40 w-72 max-w-[80%] bg-surf border-r border-line shadow-2xl shadow-black/70 p-5 flex flex-col gap-1">
  <div class="flex items-center gap-2.5 mb-6">
   <img src="logo.png" alt="Pessers" class="h-9 w-9 object-contain">
   <div class="leading-tight">
    <div class="font-display font-bold text-lg tracking-wide">PESSERS</div>
    <div class="font-display text-[11px] text-red tracking-[0.2em] -mt-1">GAMING CAFE</div>
   </div>
   <button onclick="toggleMenu()" class="ml-auto text-mute hover:text-ink text-2xl leading-none" aria-label="Close menu">&times;</button>
  </div>
  ${NAV_ITEMS.map(([k, l]) => `<button onclick="goTab('${k}')" class="text-left px-4 py-2.5 rounded-xl font-display font-semibold transition ${tab === k ? "bg-red text-white" : "text-mute hover:text-ink hover:bg-surf2"}">${l}</button>`).join("")}
 </div>`;
        drawerIn($("#drawerPanel"));
      }
      function toggleMenu() {
        menuOpen = !menuOpen;
        renderMenu();
      }

      /* ---- start ---- */
      function startM(sid) {
        curSid = sid;
        dueTouched = false;
        const st = db.stations.find((x) => x.id === sid);
        modal(`<h2 class="font-display text-xl font-bold mb-2">Start session · ${esc(st.name)}</h2>
 <label class="lbl">Customer name</label><input id="f-name" class="inp" placeholder="Name" autofocus>
 <label class="lbl">Duration (minutes)</label>
 <div class="flex gap-2 mb-2">${[30, 60, 90, 120].map((m) => `<button type="button" onclick="setDur(${m})" class="chip">${lbl(m)}</button>`).join("")}</div>
 <input id="f-dur" type="number" min="1" value="60" oninput="calcDue()" class="inp">
 <label class="lbl">Charge (Tk) — suggested from the rate card, you can change it</label>
 <input id="f-due" type="number" value="${booked$(st, 60)}" oninput="dueTouched=true" class="inp">
 <label class="lbl">Payment</label><select id="f-pay" class="inp"><option value="">Pay later</option>${opts}</select>
 <div class="flex gap-2 mt-3"><button onclick="closeM()" class="btn-g">Cancel</button><button onclick="doStart()" class="btn-p">Start</button></div>`);
      }
      function setDur(m) {
        $("#f-dur").value = m;
        dueTouched = false;
        calcDue();
      }
      function calcDue() {
        if (dueTouched) return;
        const st = db.stations.find((x) => x.id === curSid);
        $("#f-due").value = booked$(st, +$("#f-dur").value || 0);
      }
      function doStart() {
        const st = db.stations.find((x) => x.id === curSid),
          name = $("#f-name").value.trim(),
          dur = +$("#f-dur").value,
          due = Math.round(+$("#f-due").value || 0),
          pm = $("#f-pay").value;
        if (!name || !(dur > 0)) {
          alert("Enter the customer name and a duration.");
          return;
        }
        const now = Date.now();
        db.sessions.push({
          id: uid(),
          stationId: st.id,
          stationName: st.name,
          name,
          startedAt: now,
          endsAt: now + dur * 6e4,
          bookedMin: dur,
          rate: { hourly: st.hourly, half: st.half },
          due,
          payments: pm ? [{ amt: due, method: pm, at: now }] : [],
          status: "running",
          ack: false,
        });
        save();
        closeM();
        render();
      }

      /* ---- extend / pay / silence ---- */
      function extM(id) {
        const s = sess(id);
        modal(`<h2 class="font-display text-xl font-bold mb-2">Extend · ${esc(s.stationName)} (${esc(s.name)})</h2>
 <div class="flex gap-2 mb-3">${[30, 60].map((m) => `<button onclick="extend('${id}',${m})" class="chip">+${lbl(m)}</button>`).join("")}</div>
 <label class="lbl">Custom minutes</label><input id="f-x" type="number" min="1" class="inp">
 <div class="flex gap-2 mt-3"><button onclick="closeM()" class="btn-g">Cancel</button><button onclick="extend('${id}',+$('#f-x').value)" class="btn-p">Extend</button></div>`);
      }
      function extend(id, m) {
        if (!(m > 0)) return;
        const s = sess(id),
          old = booked$(s.rate, s.bookedMin);
        s.bookedMin += m;
        s.endsAt += m * 6e4;
        s.due += booked$(s.rate, s.bookedMin) - old;
        s.ack = false;
        save();
        closeM();
        render();
      }
      function payM(id) {
        const s = sess(id);
        modal(`<h2 class="font-display text-xl font-bold mb-2">Collect payment · ${esc(s.name)}</h2>
 <label class="lbl">Amount (Tk)</label><input id="f-amt" type="number" value="${s.due - paid(s)}" class="inp">
 <label class="lbl">Method</label><select id="f-pay" class="inp">${opts}</select>
 <div class="flex gap-2 mt-3"><button onclick="closeM()" class="btn-g">Cancel</button><button onclick="doPay('${id}')" class="btn-p">Record payment</button></div>`);
      }
      function doPay(id) {
        const a = Math.round(+$("#f-amt").value || 0);
        if (!a) return;
        sess(id).payments.push({
          amt: a,
          method: $("#f-pay").value,
          at: Date.now(),
        });
        save();
        closeM();
        render();
      }
      function ack(id) {
        sess(id).ack = true;
        save();
        render();
      }

      /* ---- end & bill ---- */
      function endM(id) {
        const s = sess(id),
          u = usedMin(s),
          sg = suggest(s.rate, s.bookedMin, u);
        modal(`<h2 class="font-display text-xl font-bold mb-2">End and bill · ${esc(s.stationName)} — ${esc(s.name)}</h2>
 <div class="text-sm space-y-1 mb-2 text-mute"><div>Booked ${s.bookedMin} min (${hm(s.startedAt)}–${hm(s.endsAt)}) · used ${u} min</div>
 <div>Booked price ${tk(booked$(s.rate, s.bookedMin))} · already paid ${tk(paid(s))}</div>
 <div class="font-semibold text-redlite">Suggested ${tk(sg)}${u > s.bookedMin ? " (overtime, per minute)" : u < s.bookedMin ? " (ended early, per minute)" : ""}</div></div>
 <label class="lbl">Final charge (Tk) — change it if needed</label><input id="f-ch" type="number" value="${sg}" oninput="endCalc('${id}')" class="inp">
 <div id="f-bal" class="text-sm font-medium mb-1"></div>
 <label class="lbl">Payment method</label><select id="f-pay" class="inp">${opts}</select>
 <div class="flex gap-2 mt-3"><button onclick="voidS('${id}')" class="btn-d">Void</button><button onclick="closeM()" class="btn-g">Back</button><button onclick="doEnd('${id}',${sg},${u})" class="btn-p">Confirm</button></div>`);
        endCalc(id);
      }
      function endCalc(id) {
        const b = (+$("#f-ch").value || 0) - paid(sess(id));
        $("#f-bal").innerHTML =
          b > 0
            ? `Collect <b class="text-redlite">${tk(b)}</b>`
            : b < 0
              ? `Refund <b class="text-redlite">${tk(-b)}</b>`
              : '<span class="text-mute">Settled</span>';
      }
      function doEnd(id, sg, u) {
        const s = sess(id),
          ch = Math.round(+$("#f-ch").value || 0),
          b = ch - paid(s);
        if (b)
          s.payments.push({
            amt: b,
            method: $("#f-pay").value,
            at: Date.now(),
          });
        Object.assign(s, {
          status: "done",
          endedAt: Date.now(),
          used: u,
          suggested: sg,
          due: ch,
        });
        save();
        closeM();
        render();
      }
      function voidS(id) {
        if (!confirm("Void this session? Any payment will be refunded."))
          return;
        const s = sess(id),
          p = paid(s);
        if (p)
          s.payments.push({
            amt: -p,
            method: $("#f-pay").value,
            at: Date.now(),
          });
        Object.assign(s, { status: "void", endedAt: Date.now() });
        save();
        closeM();
        render();
      }

      /* ---- finance / settings actions ---- */
      function addExp() {
        const a = Math.round(+$("#x-amt").value || 0);
        if (!a) return;
        db.expenses.push({
          id: uid(),
          cat: $("#x-cat").value,
          amt: a,
          note: $("#x-note").value.trim(),
          at: Date.now(),
        });
        save();
        render();
      }
      function delExp(id) {
        db.expenses = db.expenses.filter((e) => e.id !== id);
        save();
        render();
      }
      function ed(id, k, v) {
        db.stations.find((x) => x.id === id)[k] = v;
        save();
      }
      function toggleSt(id) {
        const s = db.stations.find((x) => x.id === id);
        if (s.active && running(id)) {
          alert("This station has a running session.");
          return;
        }
        s.active = !s.active;
        save();
        render();
      }
      function addSt() {
        const occ = new Set(
          db.stations
            .filter((x) => x.pos)
            .map((x) => x.pos.row + "," + x.pos.col),
        );
        db.stations.push({
          id: uid(),
          name: "New station",
          type: "PS4",
          hourly: 150,
          half: 80,
          order: Math.max(0, ...db.stations.map((x) => x.order)) + 1,
          active: true,
          pos: nextCell(occ),
        });
        save();
        render();
      }
      function resetAll() {
        if (confirm("Erase all sessions, expenses and stations?")) {
          db = seed();
          save();
          lastUp = {};
          render();
        }
      }
      function csv() {
        const r = [
          [
            "Date",
            "Name",
            "Station",
            "Start",
            "End",
            "Booked min",
            "Used min",
            "Suggested",
            "Charged",
            "Paid",
            "Status",
          ],
        ];
        db.sessions.forEach((s) =>
          r.push([
            dt(s.startedAt),
            s.name,
            s.stationName,
            hm(s.startedAt),
            hm(s.endedAt || s.endsAt),
            s.bookedMin,
            s.used ?? "",
            s.suggested ?? "",
            s.due,
            paid(s),
            s.status,
          ]),
        );
        const b = new Blob(
          [
            r
              .map((x) =>
                x
                  .map((v) => '"' + String(v).replace(/"/g, '""') + '"')
                  .join(","),
              )
              .join("\n"),
          ],
          { type: "text/csv" },
        );
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = "sessions.csv";
        a.click();
      }

      /* ---- one-second tick: timers, time-up detection, alarm ---- */
      setInterval(() => {
        $("#clock").textContent = new Date().toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
        });
        let un = 0,
          chg = false;
        db.sessions.forEach((s) => {
          if (s.status !== "running") return;
          const u = isUp(s);
          if (lastUp[s.id] !== u) {
            lastUp[s.id] = u;
            chg = true;
          }
          if (u && !s.ack) un++;
          const t = $("#t-" + s.id),
            e = $("#e-" + s.id),
            tm = $("#t-m-" + s.stationId),
            ta = $("#t-act-" + s.stationId),
            ea = $("#e-act-" + s.stationId);
          if (t) t.textContent = cd(s);
          if (e) e.innerHTML = est(s);
          if (tm) tm.textContent = cd(s);
          if (ta) ta.textContent = cd(s);
          if (ea) ea.innerHTML = est(s);
        });
        if (chg && tab === "stations") render();
        if (chg && popupKind) {
          renderMiniMap();
          if (popupKind.kind === "map") openFloorPlan();
          else if (popupKind.kind === "actions" && running(popupKind.id))
            stationActions(popupKind.id);
        } else if (chg) renderMiniMap();
        if (un && n++ % 2 === 0) {
          beep();
          setTimeout(beep, 300);
        }
        document.title = un ? "Time up! · Pessers POS" : "Pessers POS";
      }, 1000);
      render();
    </script>
  </body>
</html>
